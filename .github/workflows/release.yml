name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    
    # É necessário dar permissão de escrita para a Action poder criar a Release
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necessário para gerar changelog correto baseado nos commits

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build and Publish Release
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Isso diz ao electron-builder para sempre tentar publicar no GitHub
        # baseando-se na tag que originou o push. A versão da tag ditará o nome do artefato.
