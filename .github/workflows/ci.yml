name: CI

on:
  pull_request:
    branches: [ "master", "develop" ]
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Test Build
      run: npm run build
      env:
        # Ensures that electron-builder doesn't try to publish during a simple CI build
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
